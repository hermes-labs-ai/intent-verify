name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  action-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Covered fixture
        id: covered
        uses: ./
        with:
          spec: tests/fixtures/repo_ok/INTENT.md
          repo: tests/fixtures/repo_ok
          evidence-paths: src
          summary: true
      - name: Partial fixture
        id: partial
        continue-on-error: true
        uses: ./
        with:
          spec: tests/fixtures/repo_partial/INTENT.md
          repo: tests/fixtures/repo_partial
          evidence-paths: src
      - name: Documentation-only gap fixture
        id: gap
        continue-on-error: true
        uses: ./
        with:
          spec: tests/fixtures/repo_docs_only/INTENT.md
          repo: tests/fixtures/repo_docs_only
          evidence-paths: src
      - name: Assert action contract
        env:
          COVERED_OUTCOME: ${{ steps.covered.outcome }}
          COVERED_VERDICT: ${{ steps.covered.outputs.verdict }}
          COVERED_DECISION: ${{ steps.covered.outputs.decision }}
          COVERED_SUMMARY_WRITTEN: ${{ steps.covered.outputs.summary-written }}
          PARTIAL_OUTCOME: ${{ steps.partial.outcome }}
          PARTIAL_VERDICT: ${{ steps.partial.outputs.verdict }}
          PARTIAL_SUMMARY_WRITTEN: ${{ steps.partial.outputs.summary-written }}
          GAP_OUTCOME: ${{ steps.gap.outcome }}
          GAP_VERDICT: ${{ steps.gap.outputs.verdict }}
          GAP_SUMMARY_WRITTEN: ${{ steps.gap.outputs.summary-written }}
        run: |
          test "$COVERED_OUTCOME" = success
          test "$COVERED_VERDICT" = covered
          test "$COVERED_DECISION" = review
          test "$COVERED_SUMMARY_WRITTEN" = true
          test "$PARTIAL_OUTCOME" = failure
          test "$PARTIAL_VERDICT" = partial
          test "$PARTIAL_SUMMARY_WRITTEN" = false
          test "$GAP_OUTCOME" = failure
          test "$GAP_VERDICT" = gap
          test "$GAP_SUMMARY_WRITTEN" = false

  advisory-coverage-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Publish advisory coverage map
        run: |
          set +e
          intent-verify map \
            --spec AGENTS.md \
            --repo . \
            --section "What this tool does" \
            --evidence-path src \
            --evidence-path tests \
            > "$RUNNER_TEMP/intent-coverage-map.json"
          map_exit=$?
          set -e
          python -m intent_verify.summary \
            --input "$RUNNER_TEMP/intent-coverage-map.json" \
            --github-summary
          case "$map_exit" in
            0|1|2) ;;
            *) exit "$map_exit" ;;
          esac
